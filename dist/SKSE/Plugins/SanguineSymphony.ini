; Sanguine Symphony - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# This parameter skips dependency checks during component loading when set to true.
bShouldIgnoreMaintenanceChecks = false


[DynamicImpact]

# Enables or disables localized dynamic impacts during combat.
# When enabled, impacts are applied to specific body parts.
bStatus = true

# Enables realistic impact sounds based on weapon and armor interactions.
bImmersiveSounds = true

# Enables additional visual effects during impacts.
# Includes effects such as sparks on heavy armor.
bExtraImpactEffects = true

# Enables sparks when melee attacks are blocked.
# Works with weapon blocks and heavy shields.
bSparksStatus = true

# Defines the chance for sparks to appear during heavy blocks.
# Higher values increase the frequency of spark effects.
fSparksChances = 80.0


# Enables gore sounds when hitting critically wounded actors.
bGoreSounds_LowHealth = true

# Enables stronger gore sounds when an actor is killed.
bGoreSounds_Dying = true

# Enables gore sounds when striking corpses.
bGoreSounds_Corpses = true


# Defines the health percentage threshold for light impacts on unarmored actors.
fUnarmored_LightThreshold = 100.0

# Defines the health percentage threshold for moderate impacts on unarmored actors.
fUnarmored_ModerateThreshold = 80.0

# Defines the health percentage threshold for heavy impacts on unarmored actors.
fUnarmored_HeavyThreshold = 35.0

# Allows arrows to visually pierce unarmored actors.
# This does not modify actual damage calculations.
bUnarmored_ArrowCanPierce = true

# Defines the damage percentage required for arrows to pierce unarmored actors.
fUnarmored_PierceThreshold = 5.0


# Defines the health percentage threshold for light impacts on light armor actors.
fLightArmor_LightThreshold = 75.0

# Defines the health percentage threshold for moderate impacts on light armor actors.
fLightArmor_ModerateThreshold = 50.0

# Defines the health percentage threshold for heavy impacts on light armor actors.
fLightArmor_HeavyThreshold = 20.0

# Allows arrows to visually pierce light armor.
# This does not modify actual damage calculations.
bLightArmor_ArrowCanPierce = true

# Defines the damage percentage required for arrows to pierce light armor.
fLightArmor_PierceThreshold = 15.0


# Defines the health percentage threshold for light impacts on heavy armor actors.
fHeavyArmor_LightThreshold = 60.0

# Defines the health percentage threshold for moderate impacts on heavy armor actors.
fHeavyArmor_ModerateThreshold = 30.0

# Defines the health percentage threshold for heavy impacts on heavy armor actors.
fHeavyArmor_HeavyThreshold = 15.0

# Allows arrows to visually pierce heavy armor.
# This does not modify actual damage calculations.
bHeavyArmor_ArrowCanPierce = true

# Defines the damage percentage required for arrows to pierce heavy armor.
fHeavyArmor_PierceThreshold = 30.0


[BloodSpray]

# Enables dynamic blood sprays for NPCs and creatures with red blood.
bNPC = true

# Enables dynamic blood sprays for insect-type creatures.
bInsect = true

# Enables dynamic blood sprays for Dwarven automatons.
bAutomaton = true

# Defines the chance for blood sprays to occur after an impact.
# Higher values increase the frequency of blood sprays.
fChances = 80.0

# Enables additional trailing blood sprays behind the main spray.
bTrailing = true

# Enables sound effects when blood sprays hit surfaces.
bSounds = true


[Bloodpools]

# Enables or disables blood pools after deaths.
bStatus = true

# Defines the chance for a blood pool to appear after a death.
# Higher values increase the probability of formation.
fChances = 80.0

# Enables blood pools caused by blade attacks.
bEnableForBlades = true

# Enables blood pools caused by blunt attacks.
bEnableForBlunt = true

# Enables blood pools caused by ranged attacks.
bEnableForRanged = true

# Enables blood pools caused by unarmed attacks.
bEnableForUnarmed = true

# Enables blood pools caused by magical projectile attacks.
bEnableForMagic = true


# Enables blood pools for NPCs and creatures with conventional red blood.
bDefaultStatus = true

# Defines the minimum scale of blood pools for normal actors.
fDefault_ScaleMin = 1.0

# Defines the maximum scale of blood pools for normal actors.
fDefault_ScaleMax = 1.5

# Defines the minimum growth duration of blood pools for normal actors.
fDefault_DurationMin = 7.0

# Defines the maximum growth duration of blood pools for normal actors.
fDefault_DurationMax = 10.0


# Enables blood pools for insect-type creatures.
bInsectStatus = true

# Defines the minimum scale of insect blood pools.
fInsect_ScaleMin = 1.0

# Defines the maximum scale of insect blood pools.
fInsect_ScaleMax = 1.5

# Defines the minimum growth duration of insect blood pools.
fInsect_DurationMin = 7.0

# Defines the maximum growth duration of insect blood pools.
fInsect_DurationMax = 10.0


# Enables blood pools for Dwarven automatons and mechanical creatures.
bAutomatonStatus = true

# Defines the minimum scale of automaton blood pools.
fAutomaton_ScaleMin = 1.0

# Defines the maximum scale of automaton blood pools.
fAutomaton_ScaleMax = 1.5

# Defines the minimum growth duration of automaton blood pools.
fAutomaton_DurationMin = 7.0

# Defines the maximum growth duration of automaton blood pools.
fAutomaton_DurationMax = 10.0


[LetalStrikes]

# Enables or disables the impulse effect applied on lethal strikes.
# When enabled, the impact location receives an additional force impulse.
bStatus = true

# Restricts lethal strike impulses to the player only.
# Prevents NPCs from applying impulse effects to other actors.
bPlayerOnly = false

# Limits impulse effects to the last enemy killed during combat.
bLatestEnemy = true

# Defines the chance for a lethal strike impulse to trigger.
# Higher values increase the frequency of impulses.
fChances = 100.0

# Defines the calculation method used for lethal strike impulse strength.
# 0 = Generalized Mass, 1 = Free Node Mass, 2 = Controlled Node Mass.
iMethod = 0


# Defines the impulse strength for lethal strikes using one-handed swords.
fStrength_OneHandSword = 50.0

# Defines the impulse strength for lethal strikes using two-handed swords.
fStrength_TwoHandSword = 70.0

# Defines the impulse strength for lethal strikes using one-handed axes.
fStrength_OneHandAxe = 60.0

# Defines the impulse strength for lethal strikes using two-handed axes.
fStrength_TwoHandAxe = 70.0

# Defines the impulse strength for lethal strikes using one-handed maces.
fStrength_OneHandMace = 60.0

# Defines the impulse strength for lethal strikes using two-handed maces.
fStrength_TwoHandMace = 80.0

# Defines the impulse strength for lethal strikes using daggers.
fStrength_Dagger = 30.0

# Defines the impulse strength for lethal strikes using ranged weapons.
# Applies to bows and crossbows.
fStrength_Ranged = 70.0

# Defines the impulse strength for lethal strikes caused by magic.
fStrength_Magic = 70.0

# Defines the impulse strength for unarmed lethal strikes.
fStrength_HandToHand = 40.0

# Defines the impulse strength for beast-form lethal strikes.
# Applies to creatures such as werewolves.
fStrength_Beast = 70.0

# Defines the impulse strength for unspecified lethal strike sources.
fStrength_Other = 40.0


[DeathEffect]

# Enables or disables visual and audio effects when enemies die.
bStatus = true

# Allows death effects to trigger when the killing hit was blocked.
bIfBlocked = true

# Allows death effects to trigger during killmoves.
bIfKillmove = true

# Applies death effects only to the last enemy involved in combat.
bLatestEnemy = true

# Only triggers death effects when the enemy is higher level than the player.
bOnlyHigherLevel = true

# Defines the minimum level difference required between the enemy and player.
iLevelDifference = 0

# Defines the chance for death effects to trigger.
# Higher values increase the frequency of effects.
fChances = 100.0

# Selects the visual effect applied when an enemy dies.
# 0 = Disabled, 1 = Subtle Red, 2 = Desaturation, 3 = Negative, 4 = Random.
iIMODEffect = 1

# Selects the sound effect played when the player kills an enemy.
# 0 = Disabled, 1 = Subtle, 2 = Impactful.
iSoundEffect = 1

# Defines the volume multiplier of the death sound effect.
fSoundVolume = 1.0

# Enables or disables time slowdown after killing an enemy.
bSlowTimeStatus = true

# Defines the intensity of the time slowdown effect.
# Lower values create a stronger slowdown.
fSlowTimeFactor = 0.35

# Defines the duration of the time slowdown effect in seconds.
fSlowTimeDuration = 1.5


[Misc]

# Forces minimum decal values to prevent visual inconsistencies.
bDecals_EnforceMinimum = true

# Defines how long skin decals such as blood remain visible on actors.
# Value is expressed in seconds.
fDecals_SkinLifetime = 300.0

# Defines the maximum number of decals displayed on a single actor.
iDecals_MaxPerActor = 60

# Enables multiple blood decal layers to overlap.
# Improves visual density but may slightly impact performance.
bDecals_MultiLayering = true


# Defines how long blood remains visible on the player's screen after being hit.
# Set to 0 to disable this effect.
fScreenSplatterDuration = 20.0

# Enables realistic arrow deflection when surviving headshots occur.
# Simulates non-lethal glancing impacts.
bHeadshotDeflection = true

# Forces arrows to visually pierce armor when an actor dies from an arrow.
bArrowAlwaysPiercesOnDeath = true

# This workaround applies when SSE Fixes is active on version 1.5.97, preventing a CTD during game startup.
# SSE Fixes makes significant changes to the FormID and EditorID registries, preventing the mod from synchronizing its global values.
bSSEFixesWorkaround = true
